name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run unit and browser tests before publishing
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/quality.yml
    with:
      run_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests || (github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[no tests]')) }}
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
