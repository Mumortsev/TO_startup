server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    if ($host = www.artmusiclazarevskoe.ru) {
        return 308 https://artmusiclazarevskoe.ru$request_uri;
    }
    error_page 404 /not-found.html;
    location = /not-found.html { internal; add_header X-Robots-Tag "noindex, follow" always; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = /creative_music_art_startup { return 301 /; }
    location /creative_music_art_startup/ { rewrite ^/creative_music_art_startup/(.*)$ /$1 permanent; }
    location ~* ^/(assets/|engines/music/assets/) {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(webp|png|jpg|jpeg|svg|mp3|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=600, must-revalidate";
    }
    location ~* \.(html|json|xml|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location /engines/ { try_files $uri $uri/ =404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
